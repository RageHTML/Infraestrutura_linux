limit_req_zone $binary_remote_addr zone=recadastro_rl:10m rate=5r/s;
limit_req_status 429;
limit_req_log_level warn;

server {
    listen 10.0.1.10:443 ssl;
    http2 on;
    server_name recadastro.local;

    ssl_certificate     /etc/ssl/certs/recadastro.crt;
    ssl_certificate_key /etc/ssl/private/recadastro.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    server_tokens off;

    access_log /var/log/nginx/recadastro_access.log main;
    error_log  /var/log/nginx/recadastro_error.log warn;

    error_page 404 /erros/404.html;
    error_page 429 /erros/429.html;
    error_page 500 502 503 504 /erros/50x.html;

    location /erros/ {
        root /usr/share/nginx/html;
        internal;
    }

    location / {
        limit_req zone=recadastro_rl burst=10 nodelay;

        proxy_pass http://127.0.0.1:8000;
        proxy_intercept_errors on; 
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}

server {
    listen 10.0.1.10:80;
    server_name recadastro.local;
    return 301 https://$host$request_uri;
}
