[global]
   workgroup = WORKGROUP
   server string = Servidor de Arquivos Corporativo
   server role = standalone server
   security = user
   map to guest = Never

   interfaces = 10.0.4.10
   bind interfaces only = yes

   load printers = no
   printing = bsd
   printcap name = /dev/null
   disable spoolss = yes

   logging = file
   log file = /var/log/samba/log.%m
   max log size = 1000

[corporativo]
   comment = Pasta corporativa
   path = /srv/arquivos
   valid users = usuario
   read only = no
   guest ok = no